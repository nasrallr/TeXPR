# Fly.io config for the compile worker (apps/worker). Deploy from the repo root:
#   fly deploy
# App names are global on Fly: if "texpr-worker" is taken, change it here.
app = "texpr-worker"
primary_region = "yyz" # Toronto

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  MAX_JOBS = "2"
  # Fly closes HTTP connections that send nothing for 60s, so a compile must
  # finish well within that.
  COMPILE_TIMEOUT_MS = "50000"
  LATEXDIFF_TIMEOUT_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody's using it, wake on the next request (a few seconds).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
